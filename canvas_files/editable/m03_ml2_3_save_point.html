<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Save Point</title>
<style>
*{box-sizing:border-box;}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#0d0e10;color:#f1f1f1;line-height:1.6;}
.wrap{max-width:780px;margin:0 auto;padding:28px 22px 60px;}
.hero{background:linear-gradient(135deg,#0B0D10 0%,#1f1f1f 50%,#A32638 100%);padding:30px 28px;border-radius:14px;margin-bottom:16px;border:1px solid #2a2a2a;}
.hero .tag{font-size:12px;color:#f2d6da;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;}
.hero h1{margin:0 0 8px;font-family:Georgia,serif;font-size:32px;color:#fff;}
.hero p{margin:0;opacity:0.92;font-size:14px;max-width:660px;}
.scene{background:#15171a;border:1px solid #2a2a2a;border-radius:14px;padding:26px 28px;}
.scene .step-tag{font-size:11px;color:#A32638;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;}
.scene h2{margin:0 0 14px;font-family:Georgia,serif;font-size:22px;color:#fff;line-height:1.25;}
.scene .narrative{background:#0d0e10;border-left:3px solid #A32638;border-radius:0 10px 10px 0;padding:14px 18px;font-size:14px;color:#d8dadd;line-height:1.7;margin-bottom:14px;}
.scene .narrative strong{color:#fff;}
.choices{display:grid;gap:10px;margin-bottom:14px;}
.choice{background:#1a1c1f;border:2px solid #2a2a2a;border-radius:10px;padding:14px 18px;cursor:pointer;color:#fff;text-align:left;font-family:inherit;font-size:14px;line-height:1.55;transition:all 0.15s;}
.choice:hover:not(.locked){border-color:#A32638;}
.choice.picked-good{border-color:#2ec850;background:#0f2412;}
.choice.picked-bad{border-color:#dc3c46;background:#2a0d10;}
.choice .icon{display:inline-block;margin-right:8px;font-size:18px;}
.outcome{background:#0d0e10;border-left:3px solid #ffc800;border-radius:0 10px 10px 0;padding:14px 18px;margin-bottom:14px;display:none;}
.outcome.show{display:block;animation:fade 0.3s;}
.outcome.good{border-color:#2ec850;}
.outcome.bad{border-color:#dc3c46;}
.outcome .label{font-size:11px;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px;}
.outcome.good .label{color:#2ec850;}
.outcome.bad .label{color:#dc3c46;}
.outcome p{font-size:14px;color:#d8dadd;margin:0;line-height:1.7;}
.actions{text-align:right;}
.btn{background:#A32638;color:#fff;border:0;padding:11px 22px;border-radius:999px;cursor:pointer;font-family:inherit;font-size:14px;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
.progress-row{display:flex;justify-content:space-between;align-items:center;background:#15171a;border:1px solid #2a2a2a;border-radius:12px;padding:10px 16px;margin-bottom:14px;}
.progress-row .label{font-size:12px;color:#9aa0a6;}
.progress-row .val{font-family:Georgia,serif;font-size:18px;color:#fff;}
.final{background:linear-gradient(135deg,#0B0D10,#A32638);border-radius:14px;padding:36px 30px;text-align:center;}
.final h2{font-family:Georgia,serif;font-size:30px;color:#fff;margin:0 0 6px;}
.final p{color:rgba(255,255,255,0.92);}
.final .rating{font-family:Georgia,serif;font-size:36px;color:#fff;margin:8px 0;}
.final button{background:#fff;color:#A32638;border:0;padding:12px 24px;border-radius:999px;cursor:pointer;font-family:inherit;margin-top:14px;}
.hidden{display:none !important;}
</style></head><body>
<div class="wrap">
<div class="hero">
<div class="tag">Module 3 · Micro-Learning 2.3</div>
<h1>Save Point</h1>
<p>You just clicked "Train" in Teachable Machine. The model finished training. The live preview is working. What you do in the next two minutes decides whether you ship this project, or restart it.</p>
</div>
<div class="progress-row"><div><div class="label">Decisions made</div><div class="val" id="step">0 of 4</div></div><div><div class="label">Smart choices</div><div class="val" id="smart">0</div></div></div>
<div id="game"></div>
<div class="final hidden" id="final"></div>
</div>
<script>
const STEPS = [
 {
 step: "Right after training finishes",
 narrative: "The training animation just ended. You see the live webcam preview. You hold up an avocado and the model labels it 'ripe' with 87% confidence. It's working! What do you do <em>first</em>?",
 choices: [
 { text: "Save the model right now, download the file or copy the cloud link.", good: true, outcome: "✓ This is the right move. The model lives only in your browser tab. Close the tab, lose the work. Save it before anything else." },
 { text: "Start testing with more fresh avocados to see how good it really is.", good: false, outcome: "Tempting, but if you accidentally refresh the tab now, you lose everything. Save first, test second." },
 { text: "Take a screenshot to show your teacher how well it works.", good: false, outcome: "A screenshot proves nothing about the model. Save the actual model file first; you can take screenshots from the saved version later." }
 ]
 },
 {
 step: "Where to put the saved model",
 narrative: "You're about to download the file. Your downloads folder already has 200 random files in it.",
 choices: [
 { text: "Save it to Downloads with a clear name like 'avocado_classifier_v1.zip' and immediately copy the file path into my portfolio notes.", good: true, outcome: "✓ Naming + recording the path is the difference between 'finished project' and 'I'll never find that again.'" },
 { text: "Save it to Downloads with the default filename Teachable Machine gives.", good: false, outcome: "The default filename looks like 'tm-something-encoded-string.zip.' You will not find this in two days. Rename it now." },
 { text: "Skip the download, use the cloud link option instead.", good: true, outcome: "✓ Cloud link works too, as long as you record the URL somewhere you'll find it. Either approach is fine; the key is recording where you saved it." }
 ]
 },
 {
 step: "Sanity check",
 narrative: "You saved the model. Now you have a moment. Should you do anything else before moving to formal testing on Day 3?",
 choices: [
 { text: "Show the model one sample from a new condition (different angle or light) to see if it's even close.", good: true, outcome: "✓ A 30-second sanity check now can save you from wasted testing time tomorrow. If the model fails wildly on a new condition, you have an early signal." },
 { text: "Nothing, testing is for Day 3. Wait for the structured protocol.", good: false, outcome: "You can wait, but a 30-second sanity check is cheap insurance. If the model is completely broken, finding out now lets you re-train today." },
 { text: "Write a paragraph predicting what the model will be good at and what it will struggle with.", good: true, outcome: "✓ Bonus move. Writing your prediction before testing means you can compare it to the actual test results, that comparison is gold for your Model Card." }
 ]
 },
 {
 step: "One day later",
 narrative: "It's Day 3. You open Teachable Machine to start testing. The browser tab from yesterday is gone (computer restarted overnight).",
 choices: [
 { text: "Load the saved model file or cloud link from yesterday. Test starts immediately.", good: true, outcome: "✓ This is the whole reason we save. You're on time. Move on to testing." },
 { text: "Realize I never actually saved it. Retrain from scratch, at least I still have the training data.", good: false, outcome: "Re-training Teachable Machine uses the same browser session, if you closed it, your training data is also gone. This is the worst case the entire 'save point' lesson is built around." },
 { text: "Email myself the screenshot from yesterday and use that as my submission.", good: false, outcome: "A screenshot is not a model. You cannot test predictions from an image. This is the 'I thought I was done' trap." }
 ]
 }
];

let state = { i: 0, smart: 0, log: [] };
function render() {
 if (state.i >= STEPS.length) return finish();
 const s = STEPS[state.i];
 document.getElementById('step').textContent = `${state.i+1} of ${STEPS.length}`;
 document.getElementById('smart').textContent = state.smart;
 document.getElementById('game').innerHTML = `
 <div class="scene">
 <div class="step-tag">Save Point ${state.i+1}</div>
 <h2>${s.step}</h2>
 <div class="narrative">${s.narrative}</div>
 <div class="choices">
 ${s.choices.map((c,idx)=>`<button class="choice" id="ch-${idx}" onclick="pick(${idx})">${c.text}</button>`).join('')}
 </div>
 <div class="outcome" id="outcome"></div>
 <div class="actions"><button class="btn hidden" id="next-btn" onclick="next()">${state.i+1<STEPS.length?'Next save point →':'See result'}</button></div>
 </div>`;
}
function pick(idx) {
 const s = STEPS[state.i];
 const choice = s.choices[idx];
 document.querySelectorAll('.choice').forEach((el, i) => {
 el.classList.add('locked');
 el.style.cursor = 'default';
 if (i === idx) el.classList.add(choice.good ? 'picked-good' : 'picked-bad');
 el.onclick = null;
 });
 if (choice.good) state.smart++;
 state.log.push({ step: state.i, good: choice.good });
 const out = document.getElementById('outcome');
 out.className = 'outcome show ' + (choice.good ? 'good' : 'bad');
 out.innerHTML = `<div class="label">${choice.good?'Good call':'Costly choice'}</div><p>${choice.outcome}</p>`;
 document.getElementById('next-btn').classList.remove('hidden');
 document.getElementById('smart').textContent = state.smart;
}
function next() { state.i++; render(); }
function finish() {
 document.getElementById('game').classList.add('hidden');
 const final = document.getElementById('final');
 final.classList.remove('hidden');
 const rating = state.smart >= 4 ? "Ships on Time" : state.smart === 3 ? "Mostly Reliable" : state.smart === 2 ? "Almost There" : "Restart Mode";
 const msg = state.smart >= 4 ? "Every save point landed safely. You ship." :
 state.smart === 3 ? "One slip. Recoverable, but the habit is the goal." :
 state.smart === 2 ? "Half your decisions cost time. Re-run the moment whatever went wrong." :
 "These habits are what separate finished projects from lost work. Practice them by doing the sprint.";
 final.innerHTML = `<h2>Save points complete.</h2><div class="rating">${rating}</div><p>${state.smart} of ${STEPS.length} smart choices. ${msg}</p><button onclick="restart()">Run again</button>`;
}
function restart() { state = { i:0, smart:0, log:[] }; document.getElementById('final').classList.add('hidden'); document.getElementById('game').classList.remove('hidden'); render(); }
render();
</script></body></html>
