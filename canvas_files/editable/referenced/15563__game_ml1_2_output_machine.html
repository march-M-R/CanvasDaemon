<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Output Machine</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, Helvetica, sans-serif; background: #f5f5f5; color: #363d45; line-height: 1.7; padding: 24px; }

.screen { background: #0B0D10; border-radius: 12px; overflow: hidden; }
.topbar { background: #262A31; padding: 10px 16px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #363D45; }
.dot { width: 11px; height: 11px; border-radius: 50%; }
.dot-r { background: #A32638; }
.dot-y { background: #4b535c; }
.dot-g { background: #363D45; }
.bar-title { color: rgba(255,255,255,0.35); font-size: 12px; font-family: monospace; margin-left: 8px; }

.body { padding: 22px; min-height: 300px; }
.prompt-line { font-family: monospace; font-size: 13px; color: rgba(255,255,255,0.4); margin-bottom: 16px; }
.prompt-line span { color: #A32638; }

.select-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.select-label { font-family: monospace; font-size: 13px; color: rgba(255,255,255,0.5); white-space: nowrap; }
select { background: #262A31; border: 1px solid #363D45; border-radius: 6px; color: #ffffff; font-family: monospace; font-size: 13px; padding: 7px 10px; cursor: pointer; flex: 1; min-width: 180px; }
select option { background: #0B0D10; }

.run-btn { background: #A32638; color: #ffffff; border: none; border-radius: 6px; padding: 9px 22px; font-family: monospace; font-size: 13px; font-weight: bold; cursor: pointer; white-space: nowrap; }
.run-btn:hover { background: #8a1d2a; }

.output { font-family: monospace; font-size: 13px; line-height: 1.8; min-height: 100px; }
.o-line { color: rgba(255,255,255,0.35); margin-bottom: 3px; }
.o-tag { display: inline-block; padding: 2px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; margin-bottom: 8px; }
.tag-classify  { background: rgba(163,38,56,.2); color: #f2d6da; border: 1px solid #A32638; }
.tag-predict   { background: rgba(54,61,69,.4); color: #E4E5E6; border: 1px solid #4b535c; }
.tag-recommend { background: rgba(163,38,56,.1); color: #f2d6da; border: 1px solid rgba(163,38,56,.4); }
.tag-generate  { background: rgba(75,83,92,.3); color: #E4E5E6; border: 1px solid #363D45; }
.o-explain { color: rgba(255,255,255,0.65); font-size: 12px; line-height: 1.65; max-width: 580px; }

.cursor { display: inline-block; width: 9px; height: 14px; background: rgba(255,255,255,0.5); vertical-align: text-bottom; animation: blink 1s step-end infinite; }
@keyframes blink { 0%,100%{opacity:1}50%{opacity:0} }

.ref-strip { margin-top: 20px; display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }
.ref-tile { background: #ffffff; border: 1px solid #E4E5E6; border-top: 3px solid #A32638; border-radius: 10px; padding: 10px 12px; }
.rt-name { font-size: 12px; font-weight: bold; color: #0b0d10; margin-bottom: 2px; }
.rt-desc { font-size: 11px; color: #4b535c; line-height: 1.4; }

@media (max-width:520px) {
  body { padding: 14px; }
  .ref-strip { grid-template-columns: repeat(2,1fr); }
  .select-row { flex-direction: column; align-items: stretch; }
  .run-btn { width: 100%; }
}
</style>
</head>
<body>

<div class="screen">
  <div class="topbar">
    <div class="dot dot-r"></div><div class="dot dot-y"></div><div class="dot dot-g"></div>
    <span class="bar-title">ai-action-decoder</span>
  </div>
  <div class="body">
    <p class="prompt-line"><span>$</span> choose a system, then click Run</p>
    <div class="select-row">
      <span class="select-label">system:</span>
      <select id="sys">
        <option value="">-- select a system --</option>
        <option value="spam">Spam filter</option>
        <option value="maps">Maps ETA</option>
        <option value="spotify">Spotify playlist</option>
        <option value="gpt">ChatGPT draft</option>
        <option value="faceid">Face ID</option>
        <option value="netflix">Netflix home screen</option>
        <option value="weather">Weather forecast</option>
        <option value="autocorrect">Autocorrect</option>
      </select>
      <button class="run-btn" onclick="run()">&#9654; Run</button>
    </div>
    <div class="output" id="out">
      <p class="o-line">waiting for input<span class="cursor"></span></p>
    </div>
  </div>
</div>

<div class="ref-strip">
  <div class="ref-tile"><p class="rt-name">Classify</p><p class="rt-desc">Sort input into a predefined category</p></div>
  <div class="ref-tile"><p class="rt-name">Predict</p><p class="rt-desc">Estimate a future value or probability</p></div>
  <div class="ref-tile"><p class="rt-name">Recommend</p><p class="rt-desc">Rank existing options for your preferences</p></div>
  <div class="ref-tile"><p class="rt-name">Generate</p><p class="rt-desc">Create new content that did not exist before</p></div>
</div>

<script>
var d = {
  spam:      { tag:"CLASSIFY",  cls:"tag-classify",  explain:"The filter sorts each email into one of two categories: spam or inbox. Binary decision from predefined categories. That is classification." },
  maps:      { tag:"PREDICT",   cls:"tag-predict",   explain:"The travel time estimate is about something that has not happened yet. The model uses historical traffic patterns and live data to forecast it. That is prediction." },
  spotify:   { tag:"RECOMMEND", cls:"tag-recommend", explain:"All the songs already exist. Spotify selects and orders them specifically for you using your listening history and patterns from similar users. That is recommendation." },
  gpt:       { tag:"GENERATE",  cls:"tag-generate",  explain:"The email draft did not exist before you asked. The model creates new text using learned language patterns. Nothing was retrieved or ranked. That is generation." },
  faceid:    { tag:"CLASSIFY",  cls:"tag-classify",  explain:"Face ID produces a yes or no decision: owner or not owner. Two predefined categories, one decision per scan. That is classification." },
  netflix:   { tag:"RECOMMEND", cls:"tag-recommend", explain:"All the shows exist in the catalogue. Netflix personalises the order in which they appear for you based on your viewing behaviour. That is recommendation." },
  weather:   { tag:"PREDICT",   cls:"tag-predict",   explain:"A 78% rain probability is an estimate about a future event. The model uses historical meteorological patterns to forecast what will happen. That is prediction." },
  autocorrect:{ tag:"PREDICT",  cls:"tag-predict",   explain:"Autocorrect estimates the most probable word you intended based on what you typed and the surrounding context. Estimating a likely next value is prediction." }
};
function run(){
  var v = document.getElementById('sys').value;
  var o = document.getElementById('out');
  if(!v){ o.innerHTML='<p class="o-line" style="color:#A32638">error: no system selected<span class="cursor"></span></p>'; return; }
  var r = d[v];
  o.innerHTML =
    '<p class="o-line">$ running: <strong style="color:#fff">'+document.getElementById('sys').options[document.getElementById('sys').selectedIndex].text+'</strong></p>'+
    '<p class="o-line">analysing output type...</p><br>'+
    '<p><span class="o-tag '+r.cls+'">'+r.tag+'</span></p>'+
    '<p class="o-explain">'+r.explain+'</p>';
}
</script>
</body>
</html>
