<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Memorize or Learn?</title>
<style>*{box-sizing:border-box;}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#0d0e10;color:#f1f1f1;line-height:1.6;}
.wrap{max-width:920px;margin:0 auto;padding:24px 20px 60px;}
.hero{background:linear-gradient(135deg,#0B0D10 0%,#1f1f1f 50%,#A32638 100%);padding:26px 26px;border-radius:14px;margin-bottom:16px;border:1px solid #2a2a2a;}
.hero .tag{font-size:12px;color:#f2d6da;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;}
.hero h1{margin:0 0 6px;font-family:Georgia,serif;font-size:30px;color:#fff;line-height:1.14;}
.hero p{margin:0;opacity:0.92;font-size:14px;max-width:660px;}
.panel{background:#15171a;border:1px solid #2a2a2a;border-radius:14px;padding:18px 22px;margin-bottom:14px;}
.stats{display:flex;gap:10px;margin-bottom:14px;}
.stat{flex:1;background:#15171a;border:1px solid #2a2a2a;border-radius:10px;padding:10px 14px;text-align:center;}
.stat .l{font-size:11px;color:#9aa0a6;text-transform:uppercase;letter-spacing:0.05em;}
.stat .v{font-family:Georgia,serif;font-size:20px;color:#fff;margin-top:2px;}
.btn{background:#A32638;color:#fff;border:0;padding:10px 22px;border-radius:99px;cursor:pointer;font-family:inherit;font-size:14px;}
.btn:disabled{background:#444;cursor:not-allowed;}
.btn:hover:not(:disabled){filter:brightness(1.1);}
.btn.ghost{background:transparent;color:#c0c4c8;border:1px solid #444;}
.reveal{background:#0d0e10;border-left:3px solid #ffc800;border-radius:0 10px 10px 0;padding:14px 18px;margin-top:14px;display:none;color:#d8dadd;font-size:14px;line-height:1.65;}
.reveal.show{display:block;animation:fade 0.3s;}
.reveal h3{margin:0 0 6px;font-family:Georgia,serif;font-size:18px;color:#fff;}
@keyframes fade{from{opacity:0}to{opacity:1}}
.final{background:linear-gradient(135deg,#0B0D10,#A32638);border-radius:14px;padding:30px 28px;text-align:center;margin-top:14px;display:none;}
.final.show{display:block;}
.final h2{font-family:Georgia,serif;font-size:28px;color:#fff;margin:0 0 6px;}
.final .big{font-family:Georgia,serif;font-size:56px;color:#fff;line-height:1;margin:6px 0;}
.final p{color:rgba(255,255,255,0.92);max-width:540px;margin:0 auto 12px;}
.hidden{display:none!important;}
.right{color:#2ec850;}
.wrong{color:#dc3c46;}

.case{background:#15171a;border:1px solid #2a2a2a;border-radius:12px;padding:18px 22px;margin-bottom:12px;}
.case .tag{font-size:11px;color:#A32638;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px;}
.case h2{margin:0 0 8px;font-family:Georgia,serif;font-size:20px;color:#fff;}
.case .scenario{color:#c0c4c8;font-size:14px;line-height:1.6;margin-bottom:14px;}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
@media(max-width:600px){.meters{grid-template-columns:1fr;}}
.meter{background:#0d0e10;border:1px solid #2a2a2a;border-radius:10px;padding:12px 16px;}
.meter .name{font-size:11px;color:#9aa0a6;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;}
.meter .value{font-family:Georgia,serif;font-size:30px;color:#fff;margin-bottom:6px;}
.meter .bar{background:#1a1c20;border-radius:99px;height:10px;overflow:hidden;}
.meter .bar .fill{height:100%;border-radius:99px;}
.meter .bar .fill.train{background:#3a86ff;}
.meter .bar .fill.test{background:#2ec850;}
.verdicts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
@media(max-width:600px){.verdicts{grid-template-columns:1fr;}}
.v-btn{background:#1a1c1f;border:2px solid #2a2a2a;border-radius:10px;padding:12px 8px;color:#fff;cursor:pointer;font-family:inherit;font-size:13px;text-align:center;}
.v-btn:hover{border-color:#A32638;}
.v-btn.picked-right{border-color:#2ec850;background:#0f2412;}
.v-btn.picked-wrong{border-color:#dc3c46;background:#2a0d10;}
.v-btn .icon{font-size:20px;display:block;margin-bottom:4px;}
.actions{display:flex;justify-content:flex-end;margin-top:12px;}
</style></head><body>
<div class="wrap">
<div class="hero"><div class="tag">Module 2 &middot; Micro-Learning 3.1</div><h1>Memorize or Learn?</h1><p>Five model reports. For each one, read both accuracy numbers together and decide what pattern the model is showing. The gap between train and test tells the whole story.</p></div>
<div class="stats">
<div class="stat"><div class="l">Case</div><div class="v" id="round">1/5</div></div>
<div class="stat"><div class="l">Correct</div><div class="v" id="score">0</div></div>
</div>
<div id="game"></div>
<div class="final" id="final"></div>
</div>
<script>
const CASES=[
 {scenario:"Image classifier trained on 5000 cat/dog photos.",train:98,test:62,verdict:"overfit",
   explain:"Big gap. Training accuracy is far above test accuracy. The model memorized the training photos and cannot generalize."},
 {scenario:"Spam filter trained on 50000 emails over 12 months.",train:88,test:86,verdict:"learned",
   explain:"Healthy. Train and test are close. The model captured the real pattern, not the specific examples."},
 {scenario:"A simple two-feature model on weather data.",train:72,test:70,verdict:"underfit",
   explain:"Both numbers are low. The model is not memorizing, but it is also not learning enough. Needs better features or more capacity."},
 {scenario:"Resume screening model.",train:99,test:65,verdict:"overfit",
   explain:"Classic overfit. The model is memorizing patterns specific to the training resumes. New applicants will be classified poorly."},
 {scenario:"House price model with 20 well-chosen features.",train:91,test:89,verdict:"learned",
   explain:"This is what generalization looks like. The model captured the price-driving factors, not specific houses."}];
let state={i:0,score:0,locked:false};
function render(){
  if(state.i>=CASES.length)return finish();
  const c=CASES[state.i];
  document.getElementById("round").textContent=(state.i+1)+"/"+CASES.length;
  document.getElementById("score").textContent=state.score;
  document.getElementById("game").innerHTML=`
  <div class="case">
  <div class="tag">Case ${state.i+1}</div>
  <h2>${c.scenario}</h2>
  <p class="scenario">After training, the team reports these two accuracy numbers. Read them together. Decide which pattern this is.</p>
  <div class="meters">
  <div class="meter"><div class="name">Training accuracy</div><div class="value">${c.train}%</div><div class="bar"><div class="fill train" style="width:${c.train}%;"></div></div></div>
  <div class="meter"><div class="name">Test accuracy (held out)</div><div class="value">${c.test}%</div><div class="bar"><div class="fill test" style="width:${c.test}%;"></div></div></div>
  </div>
  <div class="verdicts">
  <button class="v-btn" data-v="overfit" onclick="pick('overfit')"><span class="icon">📚</span>Memorized (overfit)</button>
  <button class="v-btn" data-v="learned" onclick="pick('learned')"><span class="icon">🎯</span>Learned (generalized)</button>
  <button class="v-btn" data-v="underfit" onclick="pick('underfit')"><span class="icon">📉</span>Underfit</button>
  </div>
  <div class="reveal" id="reveal"></div>
  <div class="actions"><button class="btn hidden" id="next" onclick="next()">Next case →</button></div>
  </div>`;
  state.locked=false;
}
function pick(v){
  if(state.locked)return;state.locked=true;
  const c=CASES[state.i];
  document.querySelectorAll(".v-btn").forEach(b=>{
    const bv=b.dataset.v;
    if(bv===c.verdict)b.classList.add("picked-right");
    else if(bv===v)b.classList.add("picked-wrong");
    b.disabled=true;
  });
  if(v===c.verdict)state.score++;
  const r=document.getElementById("reveal");
  r.innerHTML=`<strong class="${v===c.verdict?'right':'wrong'}">${v===c.verdict?'Correct.':'Not quite.'}</strong> ${c.explain}`;
  r.classList.add("show");
  document.getElementById("next").classList.remove("hidden");
  document.getElementById("score").textContent=state.score;
}
function next(){state.i++;render();}
function finish(){document.getElementById("game").classList.add("hidden");const f=document.getElementById("final");f.classList.add("show");
  f.innerHTML=`<h2>${state.score} / ${CASES.length}</h2><p>The gap between training accuracy and test accuracy is the single most useful diagnostic in machine learning. Reading both together is what separates careful engineers from sloppy ones.</p><button class="btn" style="background:#fff;color:#A32638;margin-top:8px;" onclick="restart()">Run again</button>`;}
function restart(){state={i:0,score:0,locked:false};document.getElementById("final").classList.remove("show");document.getElementById("game").classList.remove("hidden");render();}
render();
</script>
</body></html>
