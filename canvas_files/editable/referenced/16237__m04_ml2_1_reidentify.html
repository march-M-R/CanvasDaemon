<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Re-Identify Me</title>
<style>*{box-sizing:border-box;}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#0d0e10;color:#f1f1f1;line-height:1.6;}
.wrap{max-width:920px;margin:0 auto;padding:24px 20px 60px;}
.hero{background:linear-gradient(135deg,#0B0D10 0%,#1f1f1f 50%,#A32638 100%);padding:26px 26px;border-radius:14px;margin-bottom:16px;border:1px solid #2a2a2a;}
.hero .tag{font-size:12px;color:#f2d6da;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;}
.hero h1{margin:0 0 6px;font-family:Georgia,serif;font-size:30px;color:#fff;line-height:1.14;}
.hero p{margin:0;opacity:0.92;font-size:14px;max-width:660px;}
.panel{background:#15171a;border:1px solid #2a2a2a;border-radius:14px;padding:18px 22px;margin-bottom:14px;}
.stats{display:flex;gap:10px;margin-bottom:14px;}
.stat{flex:1;background:#15171a;border:1px solid #2a2a2a;border-radius:10px;padding:10px 14px;text-align:center;}
.stat .l{font-size:11px;color:#9aa0a6;text-transform:uppercase;letter-spacing:0.05em;}
.stat .v{font-family:Georgia,serif;font-size:20px;color:#fff;margin-top:2px;}
.btn{background:#A32638;color:#fff;border:0;padding:10px 22px;border-radius:99px;cursor:pointer;font-family:inherit;font-size:14px;}
.btn:disabled{background:#444;cursor:not-allowed;}
.btn:hover:not(:disabled){filter:brightness(1.1);}
.btn.ghost{background:transparent;color:#c0c4c8;border:1px solid #444;}
.reveal{background:#0d0e10;border-left:3px solid #ffc800;border-radius:0 10px 10px 0;padding:14px 18px;margin-top:14px;display:none;color:#d8dadd;font-size:14px;line-height:1.65;}
.reveal.show{display:block;}
.reveal h3{margin:0 0 6px;font-family:Georgia,serif;font-size:18px;color:#fff;}
.final{background:linear-gradient(135deg,#0B0D10,#A32638);border-radius:14px;padding:30px 28px;text-align:center;margin-top:14px;display:none;}
.final.show{display:block;}
.final h2{font-family:Georgia,serif;font-size:28px;color:#fff;margin:0 0 6px;}
.final .big{font-family:Georgia,serif;font-size:56px;color:#fff;line-height:1;margin:6px 0;}
.final p{color:rgba(255,255,255,0.92);max-width:540px;margin:0 auto 12px;}
.hidden{display:none!important;}
.right{color:#2ec850;}
.wrong{color:#dc3c46;}

.record{background:#15171a;border:1px solid #2a2a2a;border-radius:12px;padding:16px 20px;margin-bottom:12px;}
.record .tag{font-size:11px;color:#A32638;text-transform:uppercase;letter-spacing:0.06em;}
.record h3{margin:4px 0 8px;font-family:Georgia,serif;font-size:18px;color:#fff;}
.record .fields{background:#0d0e10;border-left:3px solid #A32638;border-radius:0 8px 8px 0;padding:12px 14px;font-family:monospace;font-size:13px;color:#d8dadd;line-height:1.7;margin-bottom:12px;}
.meter{background:#0d0e10;border-radius:99px;height:28px;overflow:hidden;margin-bottom:12px;border:1px solid #2a2a2a;}
.meter .fill{background:linear-gradient(90deg,#2ec850,#ffc800,#dc3c46);height:100%;border-radius:99px;width:0%;transition:width 0.4s;display:flex;align-items:center;justify-content:flex-end;padding-right:12px;color:#fff;font-size:12px;font-weight:600;}
.scale{display:flex;justify-content:space-between;font-size:10px;color:#9aa0a6;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:14px;}
.guess{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:600px){.guess{grid-template-columns:1fr;}}
.guess-btn{background:#1a1c1f;border:2px solid #2a2a2a;border-radius:10px;padding:14px;color:#fff;cursor:pointer;font-family:inherit;font-size:13px;text-align:center;}
.guess-btn:hover{border-color:#A32638;}
.guess-btn.picked-right{border-color:#2ec850;background:#0f2412;}
.guess-btn.picked-wrong{border-color:#dc3c46;background:#2a0d10;}
.actions{display:flex;justify-content:flex-end;margin-top:12px;}
</style></head><body>
<div class="wrap">
<div class="hero"><div class="tag">Module 4 &middot; Micro-Learning 2.1</div><h1>Re-Identify Me</h1><p>Five 'anonymous' records, each with a few quasi-identifiers. For each, judge whether the record is actually anonymous in practice or identifiable from public records. The meter shows the real re-identification strength.</p></div>
<div class="stats">
<div class="stat"><div class="l">Record</div><div class="v" id="round">1/5</div></div>
<div class="stat"><div class="l">Correct calls</div><div class="v" id="score">0</div></div>
</div>
<div id="game"></div>
<div class="final" id="final"></div>
</div>
<script>
const RECORDS=[
 {tag:"Hospital data export",title:"Anonymous patient record",fields:["sex: Female","birth_date: 1989-04-13","zip_code: 02138","diagnosis: celiac (2022)"],identifiable:true,strength:88,explain:"Three quasi-identifiers (birth date, sex, zip) identify ~80% of US residents. 02138 is Cambridge, MA. Cross-reference with voter rolls and the name is recoverable. Sweeney (2002) is the foundational paper on this."},
 {tag:"Taxi trip log",title:"Anonymous ride record",fields:["pickup: 7:14 PM at 1600 Pennsylvania Ave NW","dropoff: 10:22 PM at 4801 Massachusetts Ave NW","trip_duration: 3h 8min"],identifiable:true,strength:94,explain:"White House to Vice Presidential Residence is a narrow corridor. Combined with time, the rider list is tiny and named officials are easy to match. de Montjoye et al. (2013) showed 4 spatio-temporal points identify 95% of people."},
 {tag:"Survey response",title:"Anonymous health survey",fields:["city_population: > 1,000,000","age_band: 25-34","sex: Female","exercises: 3x per week"],identifiable:false,strength:18,explain:"Coarse identifiers in broad bins. Millions of people match this profile. The data is genuinely anonymous because the quasi-identifiers are not granular enough."},
 {tag:"Streaming service ratings",title:"Anonymous viewer history",fields:["rated 'The Brutalist' 5 stars on 2024-03-15","rated 'Anora' 4 stars on 2024-03-21","rated 'Conclave' 3 stars on 2024-04-02"],identifiable:true,strength:78,explain:"Netflix Prize re-identification attack. Cross-reference these ratings with public IMDb reviews and the viewer can be identified within minutes. Narayanan & Shmatikov (2008)."},
 {tag:"Coffee shop transaction",title:"Anonymous credit purchase",fields:["item: iced coffee","amount: $4.75","time: Tuesday 8:13 AM","location: midtown Manhattan coffee shop (3000 customers/day)"],identifiable:false,strength:22,explain:"A single high-volume transaction in midtown is genuinely anonymous; thousands of people match. The risk shows up with a second transaction that narrows the cohort."}];
let state={i:0,score:0,locked:false};
function render(){if(state.i>=RECORDS.length)return finish();const r=RECORDS[state.i];document.getElementById("round").textContent=(state.i+1)+"/"+RECORDS.length;document.getElementById("score").textContent=state.score;document.getElementById("game").innerHTML=`<div class="record"><div class="tag">${r.tag}</div><h3>${r.title}</h3><div class="fields">${r.fields.join("<br>")}</div><div class="meter"><div class="fill" id="fill" style="width:0%;">0%</div></div><div class="scale"><span>Truly anonymous</span><span>Identifiable</span></div><div class="guess"><button class="guess-btn" data-v="anon" onclick="pick('anon')">Anonymous in practice</button><button class="guess-btn" data-v="id" onclick="pick('id')">Identifiable from public records</button></div><div class="reveal" id="reveal"></div><div class="actions"><button class="btn hidden" id="next" onclick="next()">Next record →</button></div></div>`;state.locked=false;}
function pick(v){if(state.locked)return;state.locked=true;const r=RECORDS[state.i];const correct=r.identifiable?'id':'anon';document.querySelectorAll(".guess-btn").forEach(b=>{if(b.dataset.v===correct)b.classList.add("picked-right");else if(b.dataset.v===v)b.classList.add("picked-wrong");b.disabled=true;b.onclick=null;});const fill=document.getElementById("fill");setTimeout(()=>{fill.style.width=r.strength+"%";fill.textContent=r.strength+"%";},120);if(v===correct)state.score++;document.getElementById("score").textContent=state.score;const rv=document.getElementById("reveal");rv.innerHTML=`<strong class="${v===correct?'right':'wrong'}">${v===correct?'Correct.':'Not quite.'}</strong> Re-identification strength: ${r.strength}%. ${r.explain}`;rv.classList.add("show");document.getElementById("next").classList.remove("hidden");}
function next(){state.i++;render();}
function finish(){document.getElementById("game").classList.add("hidden");const f=document.getElementById("final");f.classList.add("show");f.innerHTML=`<h2>${state.score} / ${RECORDS.length}</h2><p>Anonymity is a property of the whole dataset, not of any single field. Quasi-identifiers compound. The smaller the cohort, the easier the re-identification.</p><button class="btn" style="background:#fff;color:#A32638;margin-top:8px;" onclick="restart()">Run again</button>`;}
function restart(){state={i:0,score:0,locked:false};document.getElementById("final").classList.remove("show");document.getElementById("game").classList.remove("hidden");render();}
render();
</script>
</body></html>
